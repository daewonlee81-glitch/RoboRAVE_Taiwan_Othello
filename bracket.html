<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bracket · Robot Battle Othello · RoboRAVE Taiwan Open 2026</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"></header>
<main>
  <div id="demoBanner" class="banner" hidden data-t="Demo mode — data is saved only in this browser."></div>
  <div class="hero"><h1 data-t="Bracket"></h1><span class="chip" data-t="Robot Battle Othello"></span><span class="count" id="upd"></span></div>
  <div class="card narrow" id="gate" hidden>
    <p class="muted" data-t="Only registered participants can view the bracket. Enter your registration number and date of birth."></p>
    <form id="gf" novalidate>
      <label class="f" for="gid" data-t="Registration number"></label>
      <input type="text" id="gid" placeholder="RT-0001" autocapitalize="characters" spellcheck="false" maxlength="10">
      <label class="f" for="gdob" data-t="Date of birth"></label>
      <input type="date" id="gdob">
      <div class="err" id="gerr" role="alert"></div>
      <button class="btn pri big" type="submit" id="ggo" data-t="View bracket"></button>
    </form>
  </div>
  <div id="meBar" class="toolbar" hidden></div>
  <div class="divtabs" id="divtabs"></div>
  <div id="view"></div>
</main>
<script src="config.js"></script>
<script src="ot.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s), t = OT.t;
  document.documentElement.lang = OT.lang === 'zh' ? 'zh-Hant' : OT.lang;
  OT.header('Bracket'); OT.applyI18n();
  $('#demoBanner').hidden = !OT.demo;
  const q = new URLSearchParams(location.search);
  let div = q.get('div') === 'senior' ? 'senior' : 'junior', S = null;
  let cred = null; try { cred = JSON.parse(sessionStorage.getItem('ot.me') || 'null'); } catch (e) {}
  const stamp = () => { $('#upd').textContent = `${t('Last update')} ${new Date().toLocaleTimeString()} · ${t('Auto-refresh every 20 s')}`; };
  function tabs() {
    $('#divtabs').innerHTML = ['junior', 'senior'].map(d => {
      const n = S ? S.participants.filter(p => p.division === d).length : 0;
      return `<button class="btn sm ${d === div ? 'pri' : ''}" data-d="${d}">${OT.esc(t(d === 'junior' ? 'Junior' : 'Senior'))} (${n})</button>`;
    }).join('');
  }
  $('#divtabs').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return; div = b.dataset.d; const u = new URL(location.href); u.searchParams.set('div', div); history.replaceState(null, '', u); render(); };
  function render() {
    const signed = !!(S && S.me);
    $('#gate').hidden = signed; $('#meBar').hidden = !signed;
    if (!signed) { $('#divtabs').innerHTML = ''; $('#view').innerHTML = ''; return; }
    const me = S.me;
    $('#meBar').innerHTML = `<span>${OT.esc(t('Signed in as'))}: <b>${OT.flag(me.nationality)} ${OT.esc(me.name)}</b> · ${OT.esc(me.id)} · ${OT.esc(t(me.division === 'junior' ? 'Junior' : 'Senior'))}</span><button class="btn sm" id="out">${OT.esc(t('Sign out'))}</button>`;
    $('#out').onclick = () => { sessionStorage.removeItem('ot.me'); cred = null; S = null; render(); };
    if (!S.settings || !S.settings.bracket_public) {
      $('#divtabs').innerHTML = '';
      $('#view').innerHTML = `<div class="card" style="text-align:center;padding:40px 20px"><h2 style="margin-bottom:8px">${OT.esc(t('The bracket will be published on the competition day.'))}</h2>` +
        `<p class="muted">${OT.esc(t('Competition day'))}: ${OT.esc(OT.C.DATE || '')} · ${OT.esc(t('Registered'))}: ${S.count}</p></div>`;
      stamp(); return;
    }
    tabs();
    $('#view').innerHTML = OT.renderDivision(div, S, {}).replace(new RegExp(`(${OT.esc(me.name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'g'), '<mark>$1</mark>');
    stamp();
  }
  async function load() {
    if (!cred) { S = null; render(); return; }
    try { const r = await OT.api.view(cred.id, cred.dob); if (r && r.ok) { S = r; if (!q.get('div') && r.me) div = r.me.division; } else { sessionStorage.removeItem('ot.me'); cred = null; S = null; } render(); } catch (e) {}
  }
  $('#gf').onsubmit = async e => {
    e.preventDefault();
    const id = $('#gid').value.trim().toUpperCase(), dob = $('#gdob').value;
    $('#gerr').textContent = ''; $('#ggo').disabled = true;
    try {
      const r = await OT.api.view(id, dob);
      if (r && r.ok) { cred = { id, dob }; sessionStorage.setItem('ot.me', JSON.stringify(cred)); S = r; div = r.me.division; render(); }
      else $('#gerr').textContent = t('No registration matches this number and date of birth.');
    } catch (x) { $('#gerr').textContent = t('Could not send. Please try again.'); }
    $('#ggo').disabled = false;
  };
  load(); setInterval(() => { if (cred) load(); }, 20000);
  window.addEventListener('storage', () => { if (cred) load(); });
})();
</script>
</body>
</html>
